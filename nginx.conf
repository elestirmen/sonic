server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Güncellemeler Cloudflare ve tarayıcı önbelleğinde takılı kalmasın:
    # her istek ETag ile doğrulanır, değişmeyen dosya 304 döner.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    # Alınan mesajlar dışarıdan gelen metin; sayfa yalnız kendi betiklerini çalıştırır.
    # Tek istisna: Cloudflare'in bölgede açık olan Web Analytics sayacı (sayfa görüntüleme; ses/mesaj değil).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
}
